<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Navy background with rounded corners -->
  <rect width="32" height="32" rx="7" fill="#07111e"/>
  <!-- Subtle teal border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.5" stroke="#00c5c7" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Pixel-art 'S' glyph — left (starts x=5) -->
  <!-- Row 0: .███. -->
  <rect x="6"  y="8"  width="2" height="2" fill="#00c5c7"/>
  <rect x="8"  y="8"  width="2" height="2" fill="#00c5c7"/>
  <rect x="10" y="8"  width="2" height="2" fill="#00c5c7"/>
  <!-- Row 1: █...█ -->
  <rect x="5"  y="10" width="2" height="2" fill="#00c5c7"/>
  <rect x="11" y="10" width="2" height="2" fill="#00c5c7"/>
  <!-- Row 2: █.... -->
  <rect x="5"  y="12" width="2" height="2" fill="#00c5c7"/>
  <!-- Row 3: .███. -->
  <rect x="6"  y="14" width="2" height="2" fill="#00c5c7"/>
  <rect x="8"  y="14" width="2" height="2" fill="#00c5c7"/>
  <rect x="10" y="14" width="2" height="2" fill="#00c5c7"/>
  <!-- Row 4: ....█ -->
  <rect x="11" y="16" width="2" height="2" fill="#00c5c7"/>
  <!-- Row 5: █...█ -->
  <rect x="5"  y="18" width="2" height="2" fill="#00c5c7"/>
  <rect x="11" y="18" width="2" height="2" fill="#00c5c7"/>
  <!-- Row 6: .███. -->
  <rect x="6"  y="20" width="2" height="2" fill="#00c5c7"/>
  <rect x="8"  y="20" width="2" height="2" fill="#00c5c7"/>
  <rect x="10" y="20" width="2" height="2" fill="#00c5c7"/>

  <!-- Pixel-art 'S' glyph — right (starts x=17) -->
  <!-- Row 0 -->
  <rect x="18" y="8"  width="2" height="2" fill="#00c5c7"/>
  <rect x="20" y="8"  width="2" height="2" fill="#00c5c7"/>
  <rect x="22" y="8"  width="2" height="2" fill="#00c5c7"/>
  <!-- Row 1 -->
  <rect x="17" y="10" width="2" height="2" fill="#00c5c7"/>
  <rect x="23" y="10" width="2" height="2" fill="#00c5c7"/>
  <!-- Row 2 -->
  <rect x="17" y="12" width="2" height="2" fill="#00c5c7"/>
  <!-- Row 3 -->
  <rect x="18" y="14" width="2" height="2" fill="#00c5c7"/>
  <rect x="20" y="14" width="2" height="2" fill="#00c5c7"/>
  <rect x="22" y="14" width="2" height="2" fill="#00c5c7"/>
  <!-- Row 4 -->
  <rect x="23" y="16" width="2" height="2" fill="#00c5c7"/>
  <!-- Row 5 -->
  <rect x="17" y="18" width="2" height="2" fill="#00c5c7"/>
  <rect x="23" y="18" width="2" height="2" fill="#00c5c7"/>
  <!-- Row 6 -->
  <rect x="18" y="20" width="2" height="2" fill="#00c5c7"/>
  <rect x="20" y="20" width="2" height="2" fill="#00c5c7"/>
  <rect x="22" y="20" width="2" height="2" fill="#00c5c7"/>
</svg>
