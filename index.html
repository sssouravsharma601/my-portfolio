  <!-- Resolve theme before first paint: saved choice, else OS preference. Mirrors hooks/useTheme.ts. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('ss_theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
      if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0c10');
    })();
  </script>
